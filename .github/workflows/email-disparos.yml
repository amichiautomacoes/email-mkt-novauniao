name: Email Disparos

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Lote/campanha: lote1, lote2, lote3, lote4 ou lote5"
        required: true
        default: "lote1"
        type: choice
        options:
          - lote1
          - lote2
          - lote3
          - lote4
          - lote5
      limit:
        description: "Quantidade maxima de contatos nesta execucao"
        required: true
        default: "50"
      dry_run:
        description: "Simular sem enviar pela Resend"
        required: true
        default: true
        type: boolean

concurrency:
  group: email-mkt-disparos
  cancel-in-progress: false

jobs:
  send:
    name: Enviar campanha
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      EMAIL_BATCH_SIZE: ${{ secrets.EMAIL_BATCH_SIZE }}
      RESEND_REQUESTS_PER_SECOND: ${{ secrets.RESEND_REQUESTS_PER_SECOND }}
      DRY_RUN_DEFAULT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Send campaign
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m email_mkt.cli send --campaign "${{ inputs.campaign }}" --limit "${{ inputs.limit }}" --dry-run
          else
            python -m email_mkt.cli send --campaign "${{ inputs.campaign }}" --limit "${{ inputs.limit }}" --no-dry-run
          fi
